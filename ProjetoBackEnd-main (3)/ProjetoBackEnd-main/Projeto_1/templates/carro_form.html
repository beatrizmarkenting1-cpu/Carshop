{% extends "base.html" %}

{% block title %}{{ 'Editar carro' if editando else 'Cadastrar carro' }}{% endblock %}

{% block content %}
<h1>{{ 'Editar carro' if editando else 'Cadastrar carro' }}</h1>
<p class="text-muted">Preencha os dados do veículo que você quer vender.</p>

<form method="post" class="row g-3" style="max-width: 720px;">
    <div class="col-md-6">
        <label for="marca" class="form-label">Marca *</label>
        <input type="text" class="form-control" id="marca" name="marca" maxlength="50"
               value="{{ carro.marca or '' }}" placeholder="Ex.: Volkswagen" required>
    </div>

    <div class="col-md-6">
        <label for="modelo" class="form-label">Modelo *</label>
        <input type="text" class="form-control" id="modelo" name="modelo" maxlength="80"
               value="{{ carro.modelo or '' }}" placeholder="Ex.: Gol 1.6" required>
    </div>

    <div class="col-md-4">
        <label for="ano" class="form-label">Ano *</label>
        <input type="number" class="form-control" id="ano" name="ano" min="1886" max="2100"
               value="{{ carro.ano or '' }}" required>
    </div>

    <div class="col-md-4">
        <label for="cor" class="form-label">Cor</label>
        <input type="text" class="form-control" id="cor" name="cor" maxlength="30"
               value="{{ carro.cor or '' }}">
    </div>

    <div class="col-md-4">
        <label for="quilometragem" class="form-label">Quilometragem (km) *</label>
        <input type="number" class="form-control" id="quilometragem" name="quilometragem" min="0"
               value="{{ carro.quilometragem if carro.quilometragem is not none else '' }}" required>
    </div>

    <div class="col-md-6">
        <label for="preco" class="form-label">Preço (R$) *</label>
        <input type="number" class="form-control" id="preco" name="preco" min="0.01" step="0.01"
               value="{{ carro.preco or '' }}" required>
    </div>

    <div class="col-md-6">
        <label for="status" class="form-label">Status</label>
        <select class="form-select" id="status" name="status">
            <option value="disponivel" {{ 'selected' if carro.status != 'vendido' }}>Disponível</option>
            <option value="vendido" {{ 'selected' if carro.status == 'vendido' }}>Vendido</option>
        </select>
    </div>

    <div class="col-12">
        <label for="descricao" class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" name="descricao" rows="3" maxlength="500"
                  placeholder="Opcionais, estado de conservação, histórico...">{{ carro.descricao or '' }}</textarea>
    </div>

    <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-primary">{{ 'Salvar alterações' if editando else 'Cadastrar' }}</button>
        <a href="{{ url_for('car.listar_carros') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
